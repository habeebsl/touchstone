<!DOCTYPE html>

<html class="antialiased" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Undertone - Analyzing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Playfair+Display:wght@400;500;700&amp;family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: '#F7F4EF',
                        surface: '#FFFFFF',
                        foreground: '#1C1917',
                        muted: '#6B6259',
                        border: '#E7E1D8',
                        primary: '#2A2320',
                        onPrimary: '#FAF8F5',
                        destructive: '#B91C1C',
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"],
                        serif: ["Playfair Display", "serif"]
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .progress-bar-fill {
            animation: progress 5s linear forwards;
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 85%; }
        }
        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-foreground font-body min-h-screen flex flex-col items-center justify-center m-0">
<!-- Mobile Container (375px) -->
<div class="w-[375px] h-[812px] bg-background relative overflow-hidden shadow-2xl flex flex-col">
<!-- No app bar: this is a transient state in a linear flow. No settings, no account, nothing to navigate to. -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-8 py-12 pb-12">
<h2 class="font-serif text-2xl font-medium text-center mb-16 text-foreground tracking-wide">
                Reading your colouring
            </h2>
<!-- Measurements List -->
<div class="space-y-8 mt-4 flex-1">
<!-- Skin Row -->
<div class="flex items-center justify-between group">
<div class="flex items-center gap-6">
<div class="w-8 h-8 rounded-full shadow-sm" style="background-color: #BC9D88;"></div>
<span class="font-body text-base text-foreground font-medium">Skin</span>
</div>
<span class="font-label text-sm uppercase tracking-[0.15em] text-muted tabular-nums">#BC9D88</span>
</div>
<!-- Eyes Row -->
<div class="flex items-center justify-between group">
<div class="flex items-center gap-6">
<div class="w-8 h-8 rounded-full shadow-sm" style="background-color: #342724;"></div>
<div class="flex flex-col">
<span class="font-body text-base text-foreground font-medium">Eyes</span>
<span class="font-body text-xs text-muted">Brown</span>
</div>
</div>
<span class="font-label text-sm uppercase tracking-[0.15em] text-muted tabular-nums">#342724</span>
</div>
<!-- Hair Row -->
<div class="flex items-center justify-between group">
<div class="flex items-center gap-6">
<div class="w-8 h-8 rounded-full shadow-sm" style="background-color: #B56637;"></div>
<div class="flex flex-col">
<span class="font-body text-base text-foreground font-medium">Hair</span>
<span class="font-body text-xs text-muted">Auburn</span>
</div>
</div>
<span class="font-label text-sm uppercase tracking-[0.15em] text-muted tabular-nums">#B56637</span>
</div>
<!-- Undertone Row (Pending Skeleton) -->
<div class="flex items-center justify-between opacity-60 mt-12">
<div class="flex items-center gap-6">
<div class="w-8 h-8 rounded-full border border-dashed border-muted pulse flex items-center justify-center bg-background">
<span class="material-symbols-outlined text-muted text-[16px]">sync</span>
</div>
<span class="font-body text-base text-muted font-medium pulse">Undertone</span>
</div>
<div class="w-16 h-3 bg-border rounded-sm pulse"></div>
</div>
</div>
<!-- Progress Indicator Area -->
<div class="mt-auto pt-12 pb-8 flex flex-col items-center">
<p class="font-body text-sm text-muted mb-4 tracking-wide pulse">Rendering your looks...</p>
<div class="w-full h-[1px] bg-border relative overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-foreground progress-bar-fill"></div>
</div>
</div>
</main>
<!-- No bottom nav: Undertone is a single linear flow (intro → camera → analysing → looks → live preview).
     There are no tabs, no catalog browsing, and no settings — see docs/flow-spec.md. -->
</div>
</body></html>
